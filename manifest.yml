---
applications:
- name: greenplum-ai-agent
  path: target/greenplum-ai-agent-1.0.0.jar
  memory: 2G
  instances: 1
  buildpacks:
    - java_buildpack_offline
  env:
    JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'
    SPRING_PROFILES_ACTIVE: cloud
    # Admin PIN for the Global Pre-Training Prompt / Allowlist admin panel.
    # Set this to a strong secret before deploying. Do not commit the actual value.
    ADMIN_PIN: tanzuadmin
    PERMANENT_ADMIN_EMAILS: mike.willis@broadcom.com,abhishek.jain@broadcom.com
    # Block storage mount point — all user data, chat history, and allowlist persisted here.
    AGENT_DATA_DIR: /mnt/gp-data

  services:
    - gmd-authhub-sso          # Tanzu SSO / Broadcom AuthHub (p-identity plan: tanzu-authhub)
    - greenplum-agent-storage  # Block storage volume (1024 MB) mounted at /mnt/gp-data
    - ai-gmd-paid-svc          # Tanzu GenAI paid model service (ai-gmd-paid plan)
    - gp-mcp-greenplum         # Greenplum MCP server (gp-mcp-server.apps.tanzu.broadcom.net)
